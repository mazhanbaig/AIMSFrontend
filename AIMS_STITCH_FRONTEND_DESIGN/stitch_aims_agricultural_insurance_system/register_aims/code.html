<!DOCTYPE html>

<html class="light" lang="en"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            color: #00876A;
        }
        .emerald-glow {
            box-shadow: 0px 0px 12px rgba(0, 135, 106, 0.2);
        }
        .card-top-border {
            border-top: 4px solid #006B54;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
        .transition-soft {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

<body class="bg-surface font-body-lg text-on-surface antialiased overflow-x-hidden min-h-screen">
<main class="flex flex-col md:flex-row min-h-screen">
<!-- Left Side: Visual/Hero -->
<div class="hidden md:flex md:w-1/2 relative bg-primary overflow-hidden items-center justify-center p-margin-desktop">
<!-- Animated Background Placeholder -->

<div class="relative z-10 max-w-lg text-white">
<div class="mb-12">
<span class="font-display-lg text-display-lg font-bold">AIMS</span>
<p class="font-title-md text-title-md mt-4 text-on-primary-container">Agricultural Insurance Management System</p>
</div>
<h1 class="font-headline-lg text-headline-lg mb-6">Securing the future of global agriculture through precision insurance.</h1>
<div class="grid grid-cols-2 gap-6 mt-12">
<div class="glass-effect p-6 rounded-lg text-on-surface">
<span class="material-symbols-outlined mb-2 text-primary" style="font-variation-settings: 'FILL' 1;">eco</span>
<div class="font-bold text-title-md">1.2M+</div>
<div class="text-body-sm opacity-80">Farmers Protected</div>
</div>
<div class="glass-effect p-6 rounded-lg text-on-surface">
<span class="material-symbols-outlined mb-2 text-primary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<div class="font-bold text-title-md">99.8%</div>
<div class="text-body-sm opacity-80">Claims Accuracy</div>
</div>
</div>
</div>
<!-- Absolute Overlay Image -->
<div class="absolute bottom-0 right-0 w-full h-1/2 opacity-20 pointer-events-none" data-alt="A cinematic, high-angle aerial photograph of lush, undulating emerald green farm fields at sunrise. The soft, golden morning light catches the dew on the crops, creating a shimmering, high-trust atmosphere. The composition is clean and minimalist, echoing the modern corporate UI aesthetic with a focus on growth and agricultural stability. Deep shadows and vibrant highlights emphasize the precision of a managed landscape." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCMUccjNybXKk2kTLljLrpWTPl1x9DQernrybbo_EufFk2LMgoI0PQn9vh53kk_Fmilj7uqhQKh-wPtg-JiydtJb59P45FWMi6nrpoxeBptBzbuUUmeSY6zgMV4invNQ3uDxD75JgX5n6yd9KXnfaDOQSJ9M6vZq8qPoDGJHViTyj7MkEkPRTwf-M1O6fufyW7ofngMFz9rRe-KEXy5IwpekfM9nO6CUpWRsfMxcwcEXaVe0w7i3kNWIwAY2iVDPQIT0zY64hl7VB8')"></div>
</div>
<!-- Right Side: Registration Form -->
<div class="w-full md:w-1/2 flex items-center justify-center p-6 md:p-margin-desktop bg-surface">
<div class="w-full max-w-[520px] space-y-8 py-12">
<!-- Header -->
<div class="text-center md:text-left">
<h2 class="font-display-lg text-headline-lg md:text-display-lg text-primary mb-2">Create Account</h2>
<p class="font-body-lg text-on-surface-variant">Join AIMS as a Farmer or Insurance Provider</p>
</div>
<!-- Role Selection -->
<div class="grid grid-cols-2 gap-4">
<button class="role-card flex flex-col items-center justify-center p-6 bg-white border-2 border-outline-variant rounded-lg transition-soft hover:border-primary group" id="role-farmer" onclick="selectRole('farmer')" type="button">
<span class="material-symbols-outlined text-[32px] mb-3 group-hover:scale-110 transition-transform">leaf_spark</span>
<span class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant group-hover:text-primary">Farmer</span>
</button>
<button class="role-card flex flex-col items-center justify-center p-6 bg-white border-2 border-outline-variant rounded-lg transition-soft hover:border-primary group" id="role-provider" onclick="selectRole('provider')" type="button">
<span class="material-symbols-outlined text-[32px] mb-3 group-hover:scale-110 transition-transform">apartment</span>
<span class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant group-hover:text-primary">Insurance Staff</span>
</button>
</div>
<!-- Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<div class="space-y-4">
<!-- Name -->
<div class="relative group">
<input class="w-full h-14 px-6 rounded-full border border-outline-variant bg-white focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-soft peer" placeholder="Full Name" type="text"/>
</div>
<!-- Email -->
<div class="relative group">
<input class="w-full h-14 px-6 rounded-full border border-outline-variant bg-white focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-soft peer" placeholder="Email Address" type="email"/>
</div>
<!-- Phone -->
<div class="relative group">
<input class="w-full h-14 px-6 rounded-full border border-outline-variant bg-white focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-soft peer" placeholder="Phone Number" type="tel"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Password -->
<div class="relative group">
<input class="w-full h-14 px-6 rounded-full border border-outline-variant bg-white focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-soft peer" placeholder="Password" type="password"/>
</div>
<!-- Confirm Password -->
<div class="relative group">
<input class="w-full h-14 px-6 rounded-full border border-outline-variant bg-white focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/10 transition-soft peer" placeholder="Confirm Password" type="password"/>
</div>
</div>
</div>
<!-- Terms -->
<div class="flex items-center gap-3 px-2">
<input class="w-5 h-5 rounded border-outline-variant text-secondary focus:ring-secondary cursor-pointer" id="terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="terms">
                            I agree to the <a class="text-secondary font-semibold hover:underline" href="#">Terms &amp; Privacy Policy</a>
</label>
</div>
<!-- Submit Button -->
<button class="w-full h-14 rounded-full bg-secondary text-white font-title-md text-title-md emerald-glow hover:bg-[#00876A] active:scale-[0.98] transition-soft shadow-lg" type="submit">
                        Create Account
                    </button>
</form>
<!-- Footer Links -->
<div class="text-center pt-4">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Already have an account? 
                        <a class="text-secondary font-bold hover:underline ml-1" href="#">Login</a>
</p>
</div>
</div>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        function selectRole(role) {
            const farmerBtn = document.getElementById('role-farmer');
            const providerBtn = document.getElementById('role-provider');
            
            // Reset styles
            [farmerBtn, providerBtn].forEach(btn => {
                btn.classList.remove('border-secondary', 'bg-secondary/5', 'ring-2', 'ring-secondary/20');
                btn.classList.add('border-outline-variant');
            });

            // Apply active style
            const activeBtn = role === 'farmer' ? farmerBtn : providerBtn;
            activeBtn.classList.remove('border-outline-variant');
            activeBtn.classList.add('border-secondary', 'bg-secondary/5', 'ring-2', 'ring-secondary/20');
            
            // Add scale animation effect
            activeBtn.classList.add('scale-[1.02]');
            setTimeout(() => activeBtn.classList.remove('scale-[1.02]'), 200);
        }

        // Initialize with farmer selected
        window.onload = () => selectRole('farmer');
    </script>
</body></html>
