<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-headline { font-family: 'Geist', sans-serif; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #bec9c3; border-radius: 10px; }

        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-animate { animation: slideInUp 0.3s ease-out forwards; }

<body class="bg-background text-on-background min-h-screen flex overflow-hidden">
<!-- SideNavBar -->
<aside class="hidden md:flex flex-col py-stack-md bg-surface-container-lowest dark:bg-inverse-surface border-r border-outline-variant dark:border-outline shadow-sm h-full w-[240px] shrink-0 z-20">
<div class="px-6 mb-8">
<span class="text-headline-lg font-headline-lg font-bold text-primary">AIMS</span>
</div>
<div class="flex items-center px-6 mb-8">
<div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A portrait of a middle-aged farmer named John Doe, wearing professional agricultural attire. He is smiling warmly against a backdrop of a lush, green sustainable farm at sunrise. The lighting is soft and golden, matching the corporate modern aesthetic of the AIMS platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAaIAPcPblUF86_64EO1gHuej1KuPceHlSCvnYLBY2SC58rKMj7z2v6XJ1lVSWzMvwr8N9qx1Sgc2mR0X8XiNUoHWexpZV9kPAe1DD9_KMgXYkbW5rgaNyI49yDI0nhCdilNsWk5r6Q4JXqRpa8Ngb26A7WzhgvFtXZSbF9W9Gelzs-7uyvNJaz_IJ14DB5HzxpIDRR1m3E3Qb5Z6hAJufUkjsUGD5ySja78ceSwCttggQnLSHjKl2GheCW0v2wDiI4pXWQxWVF3n8"/>
</div>
<div class="ml-3 overflow-hidden">
<p class="text-label-md font-label-md text-on-surface truncate">John Doe</p>
<p class="text-body-sm font-body-sm text-on-surface-variant">Farmer</p>
</div>
</div>
<nav class="flex-1 space-y-1 px-2 custom-scrollbar overflow-y-auto">
<a class="flex items-center px-4 py-3 text-on-surface-variant hover:bg-surface-container-low rounded-full mx-2 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mr-3" data-icon="dashboard">dashboard</span>
<span class="text-label-md font-label-md">Dashboard</span>
</a>
<!-- ACTIVE TAB: My Profile -->
<a class="flex items-center px-4 py-3 bg-secondary-container text-on-secondary-container rounded-full mx-2 transition-all duration-300 ease-in-out shadow-sm" href="#">
<span class="material-symbols-outlined mr-3" data-icon="person">person</span>
<span class="text-label-md font-label-md">My Profile</span>
</a>
<a class="flex items-center px-4 py-3 text-on-surface-variant hover:bg-surface-container-low rounded-full mx-2 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mr-3" data-icon="map">map</span>
<span class="text-label-md font-label-md">Land Parcels</span>
</a>
<a class="flex items-center px-4 py-3 text-on-surface-variant hover:bg-surface-container-low rounded-full mx-2 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mr-3" data-icon="policy">policy</span>
<span class="text-label-md font-label-md">My Policies</span>
</a>
<a class="flex items-center px-4 py-3 text-on-surface-variant hover:bg-surface-container-low rounded-full mx-2 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mr-3" data-icon="description">description</span>
<span class="text-label-md font-label-md">Claims</span>
</a>
<a class="flex items-center px-4 py-3 text-on-surface-variant hover:bg-surface-container-low rounded-full mx-2 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mr-3" data-icon="notifications">notifications</span>
<span class="text-label-md font-label-md">Notifications</span>
</a>
<a class="flex items-center px-4 py-3 text-on-surface-variant hover:bg-surface-container-low rounded-full mx-2 transition-all duration-300 ease-in-out" href="#">
<span class="material-symbols-outlined mr-3" data-icon="settings">settings</span>
<span class="text-label-md font-label-md">Settings</span>
</a>
</nav>
<div class="mt-auto px-2 space-y-1">
<button class="w-full flex items-center px-4 py-3 text-on-surface-variant hover:bg-surface-container-low rounded-full mx-2 transition-all duration-300 ease-in-out">
<span class="material-symbols-outlined mr-3" data-icon="help">help</span>
<span class="text-label-md font-label-md">Help Center</span>
</button>
<button class="w-full flex items-center px-4 py-3 text-on-surface-variant hover:bg-surface-container-low rounded-full mx-2 transition-all duration-300 ease-in-out">
<span class="material-symbols-outlined mr-3" data-icon="logout">logout</span>
<span class="text-label-md font-label-md">Logout</span>
</button>
</div>

<!-- Main Content Area -->
<main class="flex-1 flex flex-col min-w-0 bg-background h-screen overflow-hidden">
<!-- TopNavBar -->
<header class="h-[64px] shrink-0 bg-surface-container-lowest dark:bg-inverse-surface border-b border-outline-variant dark:border-outline shadow-sm px-container-padding flex justify-between items-center z-10">
<div class="flex items-center gap-4">
<h1 class="text-headline-lg font-headline-lg font-bold text-primary">Edit Profile</h1>
</div>
<div class="flex items-center gap-3">
<button class="px-6 py-2 rounded-full border border-outline text-primary font-label-md hover:bg-surface-container-low transition-colors" onclick="window.history.back()">
                    Cancel
                </button>
<button class="px-6 py-2 rounded-full bg-primary-container text-on-primary-container font-label-md hover:opacity-80 transition-all shadow-sm" onclick="showToast()">
                    Save Changes
                </button>
</div>
</header>
<!-- Content Canvas -->
<div class="flex-1 overflow-y-auto p-container-padding custom-scrollbar">
<div class="max-w-4xl mx-auto">
<div class="bg-surface-container-lowest rounded-[1rem] border border-outline-variant shadow-sm p-8 md:p-10">
<form class="flex flex-col md:flex-row gap-12" id="profileForm">
<!-- Avatar Section -->
<div class="flex flex-col items-center gap-4 shrink-0">
<div class="relative group">
<div class="w-32 h-32 md:w-40 md:h-40 rounded-full border-4 border-surface-container overflow-hidden bg-surface-container-low">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a user with a neutral, high-clarity background suitable for a corporate dashboard. The subject is well-lit with soft, professional lighting. The overall style is clean and systematic with a focus on modern minimalist aesthetics, using a professional color palette of muted whites and greens." id="avatarPreview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAakggijY7NMyVjgrUo9AO93Hov45ncv5Ty4O9IzOumabEBk97pWp9dKxL7PJtvFtP0hSiOUFOf-hCYE4q__p4uhB2MlJDeLRAGMUHBKQGGzUOCIweMnEzMUO3OMT2HQeGQJ9ZdP48nfsCG-v3NVEXf91Xe8WB4U0QWAOqaVY6yjm5bfjCmW4ZSz3IfJKpXPr_05-gTHhlJW6c2eudLtLLKGoro4sIwzMIZtwFuALdciKnWtP1nZZ2wBHe6sl4ftw0OMlb0ITTN3XA"/>
</div>
<label class="absolute bottom-1 right-1 bg-primary text-white p-2 rounded-full shadow-lg cursor-pointer hover:scale-110 transition-transform flex items-center justify-center" for="avatarInput">
<span class="material-symbols-outlined text-[20px]" data-icon="photo_camera">photo_camera</span>
</label>
<input accept="image/*" class="hidden" id="avatarInput" type="file"/>
</div>
<div class="text-center">
<p class="text-label-md font-label-md text-on-surface">Profile Picture</p>
<p class="text-body-sm font-body-sm text-outline mt-1">JPG, PNG up to 5MB</p>
</div>
</div>
<!-- Fields Section -->
<div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="col-span-full">
<label class="block text-label-md font-label-md text-on-surface mb-2 ml-4">Full Name</label>
<input class="w-full px-6 py-3 rounded-full border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-primary focus:border-primary transition-all text-body-md font-body-md text-on-surface outline-none" type="text" value="John Doe"/>
</div>
<div class="col-span-full md:col-span-1">
<label class="block text-label-md font-label-md text-on-surface mb-2 ml-4">Email Address</label>
<input class="w-full px-6 py-3 rounded-full border border-outline-variant bg-surface-container-highest text-outline-variant text-body-md font-body-md cursor-not-allowed" disabled="" type="email" value="john.doe@farms.com"/>
<p class="mt-1 ml-4 text-[10px] text-outline">Email cannot be changed.</p>
</div>
<div class="col-span-full md:col-span-1">
<label class="block text-label-md font-label-md text-on-surface mb-2 ml-4">Phone Number</label>
<input class="w-full px-6 py-3 rounded-full border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-primary focus:border-primary transition-all text-body-md font-body-md text-on-surface outline-none" type="tel" value="+92 300 1234567"/>
</div>
<div class="col-span-full md:col-span-1">
<label class="block text-label-md font-label-md text-on-surface mb-2 ml-4">CNIC</label>
<input class="w-full px-6 py-3 rounded-full border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-primary focus:border-primary transition-all text-body-md font-body-md text-on-surface outline-none" type="text" value="42101-1234567-8"/>
</div>
<div class="col-span-full md:col-span-1">
<label class="block text-label-md font-label-md text-on-surface mb-2 ml-4">Date of Birth</label>
<input class="w-full px-6 py-3 rounded-full border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-primary focus:border-primary transition-all text-body-md font-body-md text-on-surface outline-none" type="date" value="1985-05-12"/>
</div>
<div class="col-span-full md:col-span-1">
<label class="block text-label-md font-label-md text-on-surface mb-2 ml-4">Gender</label>
<select class="w-full px-6 py-3 rounded-full border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-primary focus:border-primary transition-all text-body-md font-body-md text-on-surface outline-none appearance-none">
<option selected="" value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select>
</div>
<div class="col-span-full">
<label class="block text-label-md font-label-md text-on-surface mb-2 ml-4">Permanent Address</label>
<textarea class="w-full px-6 py-4 rounded-[1.5rem] border border-outline-variant bg-surface-container-low focus:ring-2 focus:ring-primary focus:border-primary transition-all text-body-md font-body-md text-on-surface outline-none resize-none" rows="3">Farmhouse 12, Green Acres Estate, Sector G-13, Islamabad, Pakistan</textarea>
</div>
</div>
</form>
</div>
<!-- Secondary Actions -->
<div class="mt-8 flex justify-center gap-8">
<button class="flex items-center text-error font-label-md hover:underline decoration-2 underline-offset-4">
<span class="material-symbols-outlined mr-2" data-icon="delete">delete</span>
                        Deactivate Account
                    </button>
<button class="flex items-center text-primary font-label-md hover:underline decoration-2 underline-offset-4">
<span class="material-symbols-outlined mr-2" data-icon="lock">lock</span>
                        Change Password
                    </button>
</div>
</div>
</div>
</main>
<!-- Toast Notification -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 hidden" id="successToast">
<div class="bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full flex items-center gap-3 shadow-xl border border-outline-variant toast-animate">
<span class="material-symbols-outlined text-primary-fixed" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-label-md font-label-md">Profile Updated Successfully</span>
<button class="ml-4 hover:opacity-70" onclick="hideToast()">
<span class="material-symbols-outlined text-[18px]" data-icon="close">close</span>
</button>
</div>
</div>
<script>
        function showToast() {
            const toast = document.getElementById('successToast');
            toast.classList.remove('hidden');
            setTimeout(() => {
                hideToast();
            }, 4000);
        }

        function hideToast() {
            const toast = document.getElementById('successToast');
            toast.classList.add('hidden');
        }

        // File upload preview simulation
        document.getElementById('avatarInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body></html>
